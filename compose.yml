name: lixo-certo

services:
  cache-init:
    image: redis:7.4-alpine
    container_name: lcr-cache-init
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/appendonlydir && chown -R 999:999 /data && chmod -R u+rwX /data",
      ]
    volumes:
      - redis_data:/data
    restart: "no"

  cache:
    image: redis:7.4-alpine
    container_name: lcr-cache
    restart: unless-stopped
    env_file:
      - ../api_lixocerto/.env
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    depends_on:
      cache-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    profiles: ["app"]
    build:
      context: ../api_lixocerto
      dockerfile: ../infra_lixocerto/docker/api.Dockerfile
    container_name: lcr-api
    restart: unless-stopped
    env_file:
      - ../api_lixocerto/.env
    environment:
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_TESTE_HOST: cache
      REDIS_TESTE_PORT: "6379"
      REDIS_TESTE_DB: "15"
    depends_on:
      cache:
        condition: service_healthy
    expose:
      - "50051"
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net = require('node:net'); const socket = net.createConnection({ host: '127.0.0.1', port: 50051 }); socket.setTimeout(2000); socket.once('connect', () => { socket.end(); process.exit(0); }); socket.once('error', () => process.exit(1)); socket.once('timeout', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 3m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  gateway:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.31-latest
    container_name: lcr-gateway
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./docker/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend_lixocerto
      dockerfile: ../infra_lixocerto/docker/frontend.Dockerfile
    container_name: lcr-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:3000:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  redis_data:
    name: lcr-redis-data
