name: lixo-certo

services:
  cache:
    image: redis:7.4-alpine
    container_name: lcr-cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD deve ser configurada no arquivo .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD deve ser configurada no arquivo .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    profiles: ["app"]
    build:
      context: ${API_CONTEXT:-../api_lixocerto}
      dockerfile: ${API_DOCKERFILE:-../infra_lixocerto/docker/api.Dockerfile}
    container_name: lcr-api
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-../api_lixocerto/.env}
    environment:
      AMBIENTE_EXECUCAO: ${AMBIENTE_EXECUCAO:-desenvolvimento}
      PORTA_GRPC: "50051"
      HABILITAR_REFLECTION_GRPC: ${HABILITAR_REFLECTION_GRPC:-true}
      SEGREDO_JWT: ${SEGREDO_JWT:?SEGREDO_JWT deve ser configurado no arquivo .env}
      EMISSOR_JWT: ${EMISSOR_JWT:-lixo-certo-api}
      AUDIENCIA_JWT: ${AUDIENCIA_JWT:-lixo-certo-client}
      URL_REDIS: redis://:${REDIS_PASSWORD}@cache:6379
      URL_REDIS_TESTE: redis://:${REDIS_PASSWORD}@cache:6379/15
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-http://localhost:3000}
    depends_on:
      cache:
        condition: service_healthy
    expose:
      - "50051"
    ports:
      - "127.0.0.1:${API_PORT:-50051}:50051"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  gateway:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.31-latest
    container_name: lcr-gateway
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./docker/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api:
        condition: service_started
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    profiles: ["app"]
    build:
      context: ${FRONTEND_CONTEXT:-../frontend_lixocerto}
      dockerfile: ${FRONTEND_DOCKERFILE:-../infra_lixocerto/docker/frontend.Dockerfile}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/rpc}
    container_name: lcr-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis_data:
    name: ${REDIS_VOLUME_NAME:-lcr-redis-data}
