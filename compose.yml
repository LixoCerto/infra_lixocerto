name: lixo-certo

services:
  cache-init:
    image: redis:7.4-alpine
    container_name: lcr-cache-init
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/appendonlydir && chown -R 999:1000 /data && chmod -R u+rwX /data",
      ]
    volumes:
      - redis_data:/data
    restart: "no"

  cache:
    image: redis:7.4-alpine
    container_name: lcr-cache
    user: "999:1000"
    restart: unless-stopped
    env_file:
      - ../api_lixocerto/.env
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    depends_on:
      cache-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio-data-init:
    profiles: ["app"]
    image: redis:7.4-alpine
    container_name: lcr-minio-data-init
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /data && chown 10001:10001 /data"]
    volumes:
      - minio_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  minio:
    profiles: ["app"]
    image: lixocerto-minio-community:RELEASE.2025-10-15T17-29-55Z
    pull_policy: never
    build:
      context: ./docker
      dockerfile: minio-server.Dockerfile
    container_name: lcr-minio
    restart: unless-stopped
    user: "10001:10001"
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - ./.env.minio-root
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      minio-data-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  minio-bootstrap:
    profiles: ["app"]
    image: lixocerto-minio-client:RELEASE.2025-08-13T08-35-41Z
    pull_policy: never
    build:
      context: ./docker
      dockerfile: minio-client.Dockerfile
    container_name: lcr-minio-bootstrap
    restart: "no"
    user: "10001:10001"
    tmpfs:
      - /tmp
    env_file:
      - ./.env.minio-root
      - ./.env.storage-app
    volumes:
      - ./minio-policy-descartes.json:/policy.json:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-bootstrap.sh"]
    depends_on:
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    profiles: ["app"]
    image: lixo-certo-api
    build:
      context: ../api_lixocerto
      dockerfile: ../infra_lixocerto/docker/api.Dockerfile
    container_name: lcr-api
    restart: unless-stopped
    env_file:
      - ../api_lixocerto/.env
      - ./.env.storage-app
    environment:
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_TESTE_HOST: cache
      REDIS_TESTE_PORT: "6379"
      REDIS_TESTE_DB: "15"
    depends_on:
      cache:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    expose:
      - "50051"
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net = require('node:net'); const socket = net.createConnection({ host: '127.0.0.1', port: 50051 }); socket.setTimeout(2000); socket.once('connect', () => { socket.end(); process.exit(0); }); socket.once('error', () => process.exit(1)); socket.once('timeout', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 3m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  evidencia-migration:
    profiles: ["maintenance"]
    image: lixo-certo-api
    env_file:
      - ../api_lixocerto/.env
      - ./.env.storage-app
    environment:
      LCR_EVIDENCIAS_MIGRACAO_ORIGEM: /legacy
    volumes:
      - descartes_evidencias_legado:/legacy:ro
    entrypoint: ["node", "scripts/migrar_evidencias_minio.mjs"]
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.31-latest
    container_name: lcr-gateway
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./docker/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend_lixocerto
      dockerfile: ../infra_lixocerto/docker/frontend.Dockerfile
    container_name: lcr-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:3000:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  redis_data:
    name: lcr-redis-data
  minio_data:
    name: lcr-minio-data
  descartes_evidencias_legado:
    name: lcr-descartes-evidencias
    external: true
