name: lixo-certo

services:
  cache:
    image: redis:7.4-alpine
    container_name: lcr-cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD deve ser configurada no arquivo .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD deve ser configurada no arquivo .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  keycloak:
    profiles: ["app"]
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: lcr-keycloak
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME deve ser configurado}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD deve ser configurado}
      KEYCLOAK_DEV_USER_USERNAME: ${KEYCLOAK_DEV_USER_USERNAME:?KEYCLOAK_DEV_USER_USERNAME deve ser configurado}
      KEYCLOAK_DEV_USER_EMAIL: ${KEYCLOAK_DEV_USER_EMAIL:?KEYCLOAK_DEV_USER_EMAIL deve ser configurado}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?KEYCLOAK_DEV_USER_PASSWORD deve ser configurado}
      KEYCLOAK_DEV_ADMIN_USERNAME: ${KEYCLOAK_DEV_ADMIN_USERNAME:?KEYCLOAK_DEV_ADMIN_USERNAME deve ser configurado}
      KEYCLOAK_DEV_ADMIN_EMAIL: ${KEYCLOAK_DEV_ADMIN_EMAIL:?KEYCLOAK_DEV_ADMIN_EMAIL deve ser configurado}
      KEYCLOAK_DEV_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?KEYCLOAK_DEV_ADMIN_PASSWORD deve ser configurado}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/lixo-certo-realm.json:/opt/keycloak/data/import/lixo-certo-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  api:
    profiles: ["app"]
    build:
      context: ${API_CONTEXT:-../api_lixocerto}
      dockerfile: ${API_DOCKERFILE:-../infra_lixocerto/docker/api.Dockerfile}
    container_name: lcr-api
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-../api_lixocerto/.env}
    environment:
      AMBIENTE_EXECUCAO: ${AMBIENTE_EXECUCAO:-desenvolvimento}
      PORTA_GRPC: "50051"
      HABILITAR_REFLECTION_GRPC: ${HABILITAR_REFLECTION_GRPC:-true}
      EMISSOR_OIDC: ${EMISSOR_OIDC:-http://localhost:8081/realms/lixo-certo}
      AUDIENCIA_OIDC: ${AUDIENCIA_OIDC:-lixo-certo-api}
      ENDERECO_JWKS: ${ENDERECO_JWKS:-http://keycloak:8080/realms/lixo-certo/protocol/openid-connect/certs}
      URL_REDIS: redis://:${REDIS_PASSWORD}@cache:6379
      URL_REDIS_TESTE: redis://:${REDIS_PASSWORD}@cache:6379/15
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-http://localhost:3000}
    depends_on:
      cache:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "50051"
    ports:
      - "127.0.0.1:${API_PORT:-50051}:50051"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  gateway:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.31-latest
    container_name: lcr-gateway
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./docker/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      api:
        condition: service_started
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  frontend:
    profiles: ["app"]
    build:
      context: ${FRONTEND_CONTEXT:-../frontend_lixocerto}
      dockerfile: ${FRONTEND_DOCKERFILE:-../infra_lixocerto/docker/frontend.Dockerfile}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/rpc}
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:?VITE_OIDC_ISSUER deve ser configurado}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?VITE_OIDC_CLIENT_ID deve ser configurado}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-lixo-certo-api}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:3000/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/login}
    container_name: lcr-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  redis_data:
    name: ${REDIS_VOLUME_NAME:-lcr-redis-data}
  keycloak_data:
    name: ${KEYCLOAK_VOLUME_NAME:-lcr-keycloak-data}
